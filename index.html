<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links de la Banda</title>
    <style>
        /* Estilos generales (Colores, fondo, tipografía) */
        body {
            background-color: #111111; /* Fondo oscuro */
            color: #ffffff; /* Texto blanco */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        /* Contenedor principal para celulares */
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Imagen de perfil o Logo */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Lo hace circular */
            object-fit: cover;
            border: 3px solid #ffffff;
            margin-bottom: 15px;
            margin-top: 30px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Estilos de los botones de enlaces */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espacio entre botones */
            margin-bottom: 30px;
        }

        .btn {
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        /* Efecto al pasar el mouse o tocar el botón */
        .btn:hover {
            background-color: #ffffff;
            color: #111111;
        }

        /* Imagen extra / Galería de la banda */
        .band-image {
            width: 100%;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. CAMBIA LA RUTA DE LA IMAGEN DE TU LOGO AQUÍ -->
        <img src="Documentos\Imágenes\blackbridge.jpg" alt="Logo de la banda" class="logo">
        
        <!-- 2. CAMBIA EL NOMBRE Y LA DESCRIPCIÓN AQUÍ -->
        <h1>Nombre de tu Banda</h1>
        <p>Síguenos en nuestras redes sociales</p>

        <!-- 3. PON TUS LINKS AQUÍ -->
        <div class="links-container">
            <a href="https://www.tiktok.com/@adav798?_r=1&_t=ZS-98X8vUzgLa8" target="_blank" class="btn">TikTok</a>
            <a href="https://www.instagram.com/blackbridge_band?igsh=Njhoajhobjg4bjNq" target="_blank" class="btn">Instagram</a>
            <a href="https://www.facebook.com/share/18odhgNTVz/" target="_blank" class="btn">Facebook</a>
        </div>

        <!-- 4. AGREGA UNA IMAGEN EXTRA (Ej. Una foto en vivo o un flyer) -->
        <img src="RUTA_DE_OTRA_IMAGEN_TUYA.jpg" alt="Foto de la banda en vivo" class="band-image">
        
    </div>

</body>
</html>
