<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links de la Banda</title>
    <!-- Importando FontAwesome para usar los íconos de las redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animación de entrada al cargar la página */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fondo degradado más elegante para la banda */
        body {
            background: linear-gradient(135deg, #161515 0%, #012055 100%);
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out forwards; /* Activa la animación */
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15); /* Resplandor suave */
            margin-bottom: 15px;
            margin-top: 20px;
            transition: transform 0.3s ease;
        }

        /* Efecto al tocar la foto de perfil */
        .logo:hover {
            transform: scale(1.05); 
        }

        h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            color: #bbbbbb;
            font-size: 15px;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 40px;
        }

        /* Estilo base de los botones */
        .btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; /* Espacio entre el ícono y la palabra */
            transition: all 0.3s ease;
        }

        /* Íconos más grandes */
        .btn i {
            font-size: 22px;
        }

        /* COLORES Y ANIMACIONES POR RED SOCIAL */
        
        .btn.tiktok:hover {
            background-color: #000000;
            border-color: #00f2fe;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
            transform: translateY(-4px); /* Hace que el botón flote hacia arriba */
        }

        .btn.instagram:hover {
            /* Degradado oficial de Instagram */
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-color: transparent;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4);
            transform: translateY(-4px);
        }

        .btn.facebook:hover {
            background-color: #1877f2;
            border-color: #1877f2;
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4);
            transform: translateY(-4px);
        }

        .band-image {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .band-image:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ruta de imagen corregida para que funcione en GitHub -->
        <img src="blackbridge.jpg" alt="Logo de la banda" class="logo">
        
        <h1>Blackbridge</h1>
        <p>Síguenos en nuestras redes sociales</p>

        <div class="links-container">
            <!-- Botón de TikTok con su clase y su ícono -->
            <a href="https://www.tiktok.com/@adav798?_r=1&_t=ZS-98X8vUzgLa8" target="_blank" class="btn tiktok">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            
            <!-- Botón de Instagram con su clase y su ícono -->
            <a href="https://www.instagram.com/blackbridge_band?igsh=Njhoajhobjg4bjNq" target="_blank" class="btn instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            
            <!-- Botón de Facebook con su clase y su ícono -->
            <a href="https://www.facebook.com/share/18odhgNTVz/" target="_blank" class="btn facebook">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
        </div>
                <img src="blackbridgegrupo.png" alt="Foto de la banda en vivo" class="band-image">
        
    </div>

</body>
</html>
